<script>
(function(){

try{KEY=sessionStorage.getItem('kc_admin')||''}catch(e){}
try{var sv=JSON.parse(localStorage.getItem('kc_admin_view')||'{}');if(sv.dem)V.dem=sv.dem;if(sv.jet)V.jet=sv.jet;if(sv.t)TARGET=Math.max(1,Math.min(14,+sv.t||3))}catch(e){}
function svV(){try{localStorage.setItem('kc_admin_view',JSON.stringify({dem:V.dem,jet:V.jet,t:TARGET}))}catch(e){}}
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

 dem:'<path d="M4 4h16v12H8l-4 4z"/>',jet:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',coa:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7M17 4a4 4 0 010 8M22 21c0-3-2-5-4-6"/>',
 none:'<path d="M3 7l9-4 9 4-9 4zM3 12l9 4 9-4M3 17l9 4 9-4"/>',ref:'<path d="M21 12a9 9 0 11-3-6.7L21 8M21 3v5h-5"/>',out:'<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>'}[n];
 return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(n==='none'?1.6:2)+'" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>'}

  var act=list.filter(isAct),n=act.length,s7=0,a7=0,bk=0;

  var adh=n?a7/n:0,reg=n?Math.min(1,s7/(n*TARGET)):0,sav=n?bk/n:0;
  return{n:n,tot:list.length,s7:s7,adh:adh,reg:reg,sav:sav,score:n?(adh+reg+sav)/3:0,a7:a7}
}

function badgeT(x){var j=jours(x.fin),on=x.actif==='oui',exp=j!=null&&j<0;return '<span class="b '+(!on||exp?'no':j!=null&&j<=5?'wa':'ok')+'">'+(!on?'désactivé':exp?'expiré':'actif')+'</span>'}
function finTxt(x){var j=jours(x.fin);return esc(x.fin||'—')+(j!=null?' · '+(j<0?'expiré depuis '+(-j)+' j':j+' j'):'')}
function bk(x){var st=stOf(x);return st.recu?(dd(D.auj,st.recu)<=0?'aujourd’hui':'il y a '+dd(D.auj,st.recu)+' j'):'aucune'}

function brand(c){return '<div class="top '+(c||'')+'"><img src="icon-192.png" alt=""><div><h1>Kotrana Coach</h1><small>Admin · by Stephen</small></div></div>'}
function stat(n,l,c){return '<div class="st '+(c||'')+'"><b data-cnt="'+n+'">0</b><span>'+l+'</span></div>'}
function bar(j,tot){var p=j==null?100:Math.max(4,Math.min(100,Math.round(j/Math.max(tot||30,1)*100)));return '<div class="bar '+(j!=null&&j<0?'no':j!=null&&j<=5?'wa':'')+'"><i style="--w:'+(j!=null&&j<0?100:p)+'%"></i></div>'}
function count(){document.querySelectorAll('[data-cnt]').forEach(function(e){var n=+e.dataset.cnt,t0=performance.now();(function f(t){var k=Math.min(1,(t-t0)/700);e.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)})}
function empty(m){return '<div class="empty">'+ic('none')+'<div>'+m+'</div></div>'}
function seg(key,opts){return '<div class="seg">'+opts.map(function(o){return '<button data-a="view" data-k="'+key+'" data-v="'+o[0]+'" class="'+(V[key]===o[0]?'on':'')+'">'+o[1]+'</button>'}).join('')+'</div>'}
/* ---------- vues ---------- */
function vDash(){
  var all=kpi(D.jetons.filter(function(x){return x.role==='m'})),soon=D.jetons.filter(function(x){var j=jours(x.fin);return x.actif==='oui'&&j!=null&&j>=0&&j<=7}),
      lock=D.jetons.filter(function(x){return x.echecs>=8}),idle=D.jetons.filter(function(x){return x.role==='m'&&isAct(x)&&!stOf(x).tot&&x.debut&&dd(D.auj,x.debut)>=3});
  var h='<div class="stats">'+stat(nPend(),'demande(s) en attente',nPend()?'hot':'')+stat(all.n,'adhérent(s) actif(s)')+stat(all.s7,'séances cette semaine')+stat(pc(all.adh),'% d’adhérents actifs · 7 j',all.n&&all.adh<.4?'warn':'')+'</div>';
  var i=0;
  h+='<div class="sec">Performance des coachs</div>';
  h+=D.coachs.length?'<div class="grid">'+D.coachs.map(function(c){var k=kpi(adhOf(c.id));
    return '<div class="card" style="--i:'+(i++)+'"><div class="row"><h3 class="sp">'+esc(c.nom)+'</h3>'+(k.n?'<span class="score '+cls(k.score)+'">'+pc(k.score)+'<small style="font-size:12px">/100</small></span>':'<span class="b">sans adhérent</span>')+'</div>'
     +'<div class="mu">'+k.n+' adhérent(s) actif(s) sur '+k.tot+' · '+k.s7+' séance(s) · 7 j</div>'
     +(k.n?kbar('Adhérence',k.adh,'Adhérents actifs ayant envoyé au moins 1 séance sur 7 jours')+kbar('Régularité',k.reg,'Séances de la semaine ÷ (adhérents actifs × objectif '+TARGET+')')+kbar('Sauvegarde',k.sav,'Adhérents ayant synchronisé depuis hier'):'')
     +'<div class="acts"><button class="s" data-a="opencoach" data-c="'+esc(c.id)+'">Ouvrir</button></div></div>'}).join('')+'</div>':empty('Aucun coach pour l’instant.');
  h+='<div class="sec">À surveiller</div><div class="card plain">';
  var al=[];
  if(nPend())al.push('<div class="al"><span><b>'+nPend()+'</b> demande(s) en attente</span><button class="s" data-a="tab" data-t="dem">Voir</button></div>');
  soon.forEach(function(x){al.push('<div class="al"><span><b>'+esc(x.nom)+'</b> · '+(x.role==='c'?'coach':esc(coachNom(x.coachId)))+' · expire dans '+jours(x.fin)+' j</span><button class="s" data-a="man" data-j="'+esc(x.jid)+'">Gérer</button></div>')});
  lock.forEach(function(x){al.push('<div class="al"><span><b>'+esc(x.nom)+'</b> · compte verrouillé (trop d’essais)</span><button class="s" data-a="man" data-j="'+esc(x.jid)+'">Gérer</button></div>')});
  idle.forEach(function(x){al.push('<div class="al"><span><b>'+esc(x.nom)+'</b> · aucune séance envoyée depuis '+dd(D.auj,x.debut)+' j</span><button class="s" data-a="man" data-j="'+esc(x.jid)+'">Gérer</button></div>')});
  h+=(al.length?al.join(''):'<div class="mu">Rien à signaler.</div>')+'</div>';
  h+='<div class="sec">Réglage des KPI</div><div class="card plain"><div class="row"><div class="sp"><label style="margin:0">Objectif : séances par adhérent et par semaine</label></div><div class="sbtn">'+[1,2,3,4,5,6].map(function(n){return '<button data-a="tgt" data-n="'+n+'" class="'+(TARGET===n?'on':'')+'">'+n+'</button>'}).join('')+'</div></div><div class="mu" style="margin-top:8px">Les KPI ne comptent que des séances et des dates : aucun contenu d’entraînement n’est affiché ici.</div></div>';
  return h;
}
function demCard(x,i){
  var att=x.statut==='en attente',co=x.coachId==='NEW',mdp=/^\[MDP OUBLI/.test(x.infos||''),m=(x.infos||'').match(/ID ([A-Z0-9]{4,12})/);
  return '<div class="card" style="--i:'+i+'"><div class="row"><h3 class="sp">'+esc(x.nom)+'</h3>'+(mdp?'<span class="b wa">mot de passe oublié</span>':'<span class="b '+(co?'ac':'')+'">'+(co?'coach':'adhérent')+'</span>')+'</div>'
   +'<div class="row" style="margin-top:4px"><span class="b '+(att?'wa':x.statut==='refusée'?'no':'ok')+'">'+esc(x.statut)+'</span></div>'
   +'<div class="mu" style="margin-top:6px;overflow-wrap:anywhere">'+esc(x.contact)+(co||mdp?'':' · coach : '+esc(coachNom(x.coachId)))+'</div><div class="mu">'+esc(x.date)+(mdp?'':' · CGU '+esc(x.cgu))+'</div>'
   +(x.infos&&!mdp?'<div style="margin-top:8px;overflow-wrap:anywhere">'+esc(x.infos)+'</div>':'')
   +'<div class="acts">'+(att?(mdp?'<button class="p s" data-a="forgotgo" data-d="'+esc(x.id)+'" data-j="'+esc(m?m[1]:'')+'">Envoyer un nouveau jeton</button>':'<button class="p s" data-a="newtok" data-d="'+esc(x.id)+'">Créer le jeton</button>')+'<button class="s d" data-a="refuse" data-d="'+esc(x.id)+'">Refuser</button>':'')
   +'<button class="s d" data-a="demdel" data-d="'+esc(x.id)+'">Supprimer</button></div></div>'}
function vDem(){
  var L=D.demandes.slice().reverse(),done=L.filter(function(x){return x.statut!=='en attente'}).length;
  var h='<div class="pg"><h2 class="sp">Demandes</h2>'+seg('dem',[['kan','Kanban'],['list','Liste']])+(done?'<button class="s d" data-a="demclean">Supprimer les '+done+' traitée(s)</button>':'')+'</div>';
  if(!L.length)return h+empty('Aucune demande pour le moment.');

    var cols=[['en attente','En attente',function(x){return x.statut==='en attente'}],['ok','Traitées',function(x){return x.statut!=='en attente'&&x.statut!=='refusée'}],['no','Refusées',function(x){return x.statut==='refusée'}]];
    return h+'<div class="kan">'+cols.map(function(c){var l=L.filter(c[2]);return '<div class="col"><h4><span>'+c[1]+'</span><span class="b">'+l.length+'</span></h4>'+(l.length?l.map(function(x,i){return demCard(x,i)}).join(''):'<div class="mu" style="padding:10px;text-align:center">Vide</div>')+'</div>'}).join('')+'</div>';

   +'<div class="m">'+badgeT(x)+' <span class="mu">'+finTxt(x)+'</span></div>'
   +(x.role==='m'?'<div class="m"><div class="kb" style="margin:0"><span style="flex-basis:70px">7 j</span><div class="bar '+cls(p)+'" ><i style="--w:'+Math.max(2,pc(p))+'%"></i></div><em>'+st.s7+'/'+TARGET+'</em></div><div class="mu">Sauvegarde : '+bk(x)+' · '+st.tot+' séance(s)</div></div>':'<div class="m mu">Compte coach</div>')
   +'<div class="g"><button class="s" data-a="adjopen" data-j="'+esc(x.jid)+'">Abonnement</button><button class="p s" data-a="man" data-j="'+esc(x.jid)+'">Gérer</button></div></div>'}

function vJet(){
  var J=D.jetons.filter(function(x){var j=jours(x.fin),on=x.actif==='oui',exp=j!=null&&j<0;

    if(flt==='soon'&&!(on&&j!=null&&j>=0&&j<=7))return false;if(flt==='off'&&!(!on||exp))return false;
    return !q||(x.nom+' '+coachNom(x.coachId)+' '+(x.note||'')+' '+(x.email||'')+' '+x.jid).toLowerCase().indexOf(q.toLowerCase())>=0});
  J.sort(function(a,b){return (coachNom(a.coachId)+(a.role==='c'?'0':'1')+a.nom).localeCompare(coachNom(b.coachId)+(b.role==='c'?'0':'1')+b.nom)});

  if(sheet.tok){
    var s=sheet,m=msgTok(s);s.msg=m;
    return '<div class="ov"><div><h3>'+(s.regen?'Nouveau jeton':'Jeton créé')+' · '+esc(s.nom)+'</h3><p class="mu">Il ne sera plus jamais affiché. Copie-le ou envoie-le maintenant.</p><div class="tok">'+esc(s.tok)+'</div><div class="row"><button class="p sp" data-a="cp" data-v="'+esc(s.tok)+'">Copier le jeton</button></div>'
     +(s.role==='c'&&s.code&&!s.regen?'<div class="hint">Compte coach créé automatiquement · code <b>'+esc(s.code)+'</b></div>':'')
     +'<label>Envoyer par e-mail</label><div class="row"><input id="f-to" class="sp" type="email" autocapitalize="none" placeholder="adresse e-mail du destinataire" value="'+esc(s.to!=null?s.to:(s.email||''))+'" style="width:auto"><button class="p" data-a="sendmail" '+(s.sent?'disabled':'')+'>'+(s.sent?'Envoyé ✓':'Envoyer')+'</button></div>'
     +(s.sent?'<div class="hint">E-mail envoyé à <b>'+esc(s.sent)+'</b> depuis kotranabysas@gmail.com.</div>':'')
     +'<label>Message</label><pre>'+esc(m)+'</pre><div class="row"><button class="sp" data-a="cpmsg">Copier le message</button><button data-a="closesheet">Fermer</button></div></div></div>';
  }
  var co=sheet.role==='c',opts=D.coachs.map(function(c){return '<option value="'+esc(c.id)+'"'+(c.id===sheet.coachId?' selected':'')+'>'+esc(c.nom)+'</option>'}).join('');
  return '<div class="ov"><div><h3>Nouveau jeton</h3>'
   +'<label>Rôle</label><div class="sbtn" id="f-role">'+[['m','Adhérent'],['c','Coach']].map(function(r){return '<button data-a="role" data-r="'+r[0]+'" class="'+(sheet.role===r[0]?'on':'')+'">'+r[1]+'</button>'}).join('')+'</div>'
   +(co?'<div class="hint">Le compte coach est créé automatiquement avec ce nom. Il n’y a rien d’autre à préparer.'+(sheet.email?'<br>E-mail : <b>'+esc(sheet.email)+'</b>':'')+'</div>'
       :(D.coachs.length?'<label>Coach</label><select id="f-coach">'+opts+'</select>':'<div class="hint">Aucun coach pour l’instant : crée d’abord le jeton d’un coach.</div>'))
   +'<label>Nom</label><input id="f-nom" value="'+esc(sheet.nom||'')+'" autocomplete="off"><label>E-mail (facultatif, sert d’identifiant)</label><input id="f-em" type="email" autocapitalize="none" value="'+esc(sheet.email||'')+'">'
   +'<label>Durée</label><div class="sbtn">'+PRE.map(function(p){return '<button data-a="pre" data-m="'+p[1]+'" data-j="'+p[2]+'" data-o="'+p[0]+'" class="'+((p[1]?(+sheet.mois===p[1]):(!sheet.mois&&+sheet.jours===p[2]))?'on':'')+'">'+p[0]+'</button>'}).join('')+'</div>'
   +'<div class="row" style="margin-top:8px"><div class="sp"><label>Offre</label><input id="f-offre" value="'+esc(sheet.offre||'1 mois')+'"></div><div class="sp"><label>'+(sheet.mois?'Mois':'Jours')+'</label><input id="f-j" type="number" min="1" max="'+(sheet.mois?24:800)+'" value="'+esc(sheet.mois||sheet.jours||30)+'"></div></div>'
   +'<div class="row" style="margin-top:16px"><button class="p sp" data-a="mk" '+((!co&&!D.coachs.length)?'disabled':'')+'>Créer le jeton</button><button data-a="closesheet">Annuler</button></div></div></div>';
}
function adjHtml(x){var j=jours(x.fin);
  return '<div class="mu">Fin actuelle : <b>'+finTxt(x)+'</b></div><div class="adj">'
   +[['−1 mois',-1,0],['−10 j',0,-10],['−7 j',0,-7],['+7 j',0,7],['+10 j',0,10],['+1 mois',1,0],['+3 mois',3,0],['+6 mois',6,0]].map(function(a){return '<button data-a="adj" data-j="'+esc(x.jid)+'" data-mo="'+a[1]+'" data-d="'+a[2]+'">'+a[0]+'</button>'}).join('')+'</div>'
   +'<div class="row"><input id="f-fin" type="date" class="sp" value="'+esc(x.fin||'')+'" style="width:auto"><button data-a="setfin" data-j="'+esc(x.jid)+'">Fixer la date</button></div>'}
function cp(v){
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(function(){toast('Copié')},function(){toast('Copie refusée : sélectionne le texte')});
  else toast('Copie indisponible : sélectionne le texte');
}
function keep(){if(sheet&&!sheet.tok&&!sheet.man&&!sheet.adj&&!sheet.del){var g=function(i){var e=$(i);return e?e.value:null};var n=g('#f-nom'),o=g('#f-offre'),j=g('#f-j'),c=g('#f-coach'),em=g('#f-em');if(n!=null)sheet.nom=n;if(em!=null)sheet.email=em.trim();if(o!=null)sheet.offre=o;if(j!=null){if(sheet.mois)sheet.mois=+j;else sheet.jours=j}if(c)sheet.coachId=c}}
var sure={};
async function act(e){
  var t=e.target.closest('[data-a]');if(!t||busy)return;var a=t.dataset.a;
  if(a==='login'){KEY=$('#k').value.replace(/\s+/g,'').toUpperCase();if(!KEY)return;try{sessionStorage.setItem('kc_admin',KEY)}catch(x){}busy=true;window.__recount=true;await load(true);busy=false;return}
  if(a==='logout'){KEY='';D=null;first=true;sheet=null;try{sessionStorage.removeItem('kc_admin')}catch(x){}render();return}
  if(a==='refresh'){busy=true;window.__recount=true;await load();busy=false;return}
  if(a==='tab'){tab=t.dataset.t;if(tab!=='coa')coachSel=null;window.__recount=true;render();window.scrollTo({top:0,behavior:'smooth'});return}
  if(a==='view'){V[t.dataset.k]=t.dataset.v;svV();window.__fq=0;render();return}
  if(a==='tgt'){TARGET=+t.dataset.n;svV();window.__recount=false;render();return}
  if(a==='flt'){flt=t.dataset.f;window.__fq=0;render();return}
  if(a==='opencoach'){tab='coa';coachSel=t.dataset.c;window.__recount=true;render();window.scrollTo({top:0,behavior:'smooth'});return}
  if(a==='backcoach'){coachSel=null;render();return}
  if(a==='cp'){cp(t.dataset.v);return}
  if(a==='cpmsg'){cp(sheet.msg);return}
  if(a==='closesheet'){sheet=null;render();return}
  if(a==='man'){sheet={man:t.dataset.j};render();return}
  if(a==='adjopen'){sheet={adj:t.dataset.j};render();return}
  if(a==='role'){keep();sheet.role=t.dataset.r;render();return}
  if(a==='pre'){keep();sheet.mois=+t.dataset.m||0;sheet.jours=+t.dataset.j||30;sheet.offre=t.dataset.o;render();return}
  if(a==='delc'){sheet={del:{id:t.dataset.c,step:1,ok:false}};render();return}
  if(a==='delask'){if(!$('#f-ok').checked){toast('Coche la case pour confirmer');return}
    busy=true;t.textContent='Envoi du code…';var ra=await call({op:'coachDelAsk',coachId:sheet.del.id});busy=false;
    if(ra.ok){sheet.del.step=2;render()}else{render();toast(ra.e==='envoi'?'Envoi du code impossible':msgErr(ra))}return}
  if(a==='delgo'){var cd=($('#f-code').value||'').replace(/\D/g,'');if(cd.length!==6){toast('Entre le code à 6 chiffres');return}
    busy=true;t.textContent='Suppression…';var rd=await call({op:'coachDel',coachId:sheet.del.id,code:cd});busy=false;
    if(rd.ok){sheet=null;coachSel=null;window.__recount=true;await load(true);toast('Coach supprimé · '+rd.supprime.jetons+' jeton(s) effacé(s)')}else{render();toast(rd.e==='code'?'Code incorrect ou expiré':msgErr(rd))}return}
  if(a==='sendmail'){var to=($('#f-to').value||'').trim();sheet.to=to;if(!RXM.test(to)){toast('Entre une adresse e-mail valide');return}
    busy=true;t.textContent='Envoi…';var rm=await call({op:'mail',to:to,sujet:sheet.regen?'Ton nouveau jeton Kotrana Coach':'Ton accès Kotrana Coach',corps:sheet.msg});busy=false;
    if(rm.ok){sheet.sent=to;render();toast('E-mail envoyé')}else{render();toast(rm.e==='limite'?'Limite d’envois du jour atteinte':rm.e==='envoi'?'Envoi refusé par Google':msgErr(rm))}return}
  if(a==='newtok'||a==='newmem'){var d=t.dataset.d?D.demandes.filter(function(x){return x.id===t.dataset.d})[0]:null,co=d&&d.coachId==='NEW';
    sheet={role:co?'c':'m',coachId:t.dataset.c||(d&&!co?d.coachId:(D.coachs[0]||{}).id),nom:d?d.nom:'',demandeId:d?d.id:'',email:d&&RXM.test(d.contact)?d.contact:'',offre:'1 mois',mois:1,jours:30};render();return}
  if(a==='adj'||a==='setfin'){
    busy=true;var ro=a==='adj'?await call({op:'tokenSet',jid:t.dataset.j,delta:{mois:+t.dataset.mo||0,jours:+t.dataset.d||0}}):await call({op:'tokenSet',jid:t.dataset.j,fin:$('#f-fin').value});
    busy=false;if(ro.ok){await load(true);toast('Fin d’abonnement : '+ro.fin)}else toast(msgErr(ro));return}
  var need={regen:1,refuse:1,demdel:1,demclean:1,tokdel:1}[a];var key=a+(t.dataset.j||t.dataset.d||'');
  if(need&&sure[key]!==1){sure={};sure[key]=1;t.dataset.o=t.textContent;t.textContent=a==='tokdel'?'Confirmer : tout sera effacé':'Confirmer ?';setTimeout(function(){if(sure[key]===1){sure={};render()}},3500);return}
  sure={};busy=true;var r;
  if(a==='mk'){
    keep();
    var o={op:'tokenNew',role:sheet.role,coachId:sheet.role==='c'?'':sheet.coachId,nom:(sheet.nom||'').trim(),email:sheet.email||'',offre:sheet.offre,mois:sheet.mois?+sheet.mois:0,jours:+sheet.jours||30,demandeId:sheet.demandeId};
    if(!o.nom){toast('Entre un nom');busy=false;return}
    if(o.email&&!RXM.test(o.email)){toast('E-mail invalide');busy=false;return}
    r=await call(o);
    if(r.ok){sheet={tok:r.token,fin:r.fin,nom:o.nom,role:o.role,uid:r.uid,code:r.coach&&r.coach.code,email:o.email,lien:appLink()};await load(true);toast(r.coach?'Compte coach créé':'Jeton créé')}else toast(msgErr(r));
  }
  else if(a==='act'){r=await call({op:'tokenSet',jid:t.dataset.j,actif:t.dataset.v});if(r.ok){await load(true);toast(t.dataset.v==='oui'?'Réactivé':'Désactivé')}else toast(msgErr(r))}
  else if(a==='reset'){r=await call({op:'tokenReset',jid:t.dataset.j});if(r.ok){await load(true);toast('Appareil libéré')}else toast(msgErr(r))}
  else if(a==='regen'||a==='forgotgo'){
    var jid=t.dataset.j;if(!jid||!tk(jid)){toast('Compte introuvable');busy=false;return}
    r=await call({op:'tokenRegen',jid:jid});
    if(r.ok){var xj=tk(jid)||{};if(a==='forgotgo')await call({op:'demandeSet',id:t.dataset.d,statut:'traité'});sheet={tok:r.token,fin:xj.fin,nom:xj.nom||'',role:xj.role,uid:jid,email:xj.email||'',regen:true,lien:appLink()};await load(true);toast('Nouveau jeton créé')}else toast(msgErr(r))}
  else if(a==='tokdel'){r=await call({op:'tokenDel',jid:t.dataset.j});if(r.ok){sheet=null;await load(true);toast('Adhérent supprimé · '+r.seances+' séance(s) effacée(s)')}else toast(msgErr(r))}
  else if(a==='refuse'){r=await call({op:'demandeSet',id:t.dataset.d,statut:'refusée'});if(r.ok){await load(true);toast('Demande refusée')}else toast(msgErr(r))}
  else if(a==='demdel'){r=await call({op:'demandeDel',ids:[t.dataset.d]});if(r.ok){await load(true);toast('Demande supprimée')}else toast(msgErr(r))}
  else if(a==='demclean'){r=await call({op:'demandeDel',scope:'done'});if(r.ok){await load(true);toast(r.n+' demande(s) supprimée(s)')}else toast(msgErr(r))}
  busy=false;
}
document.addEventListener('click',act);
document.addEventListener('input',function(e){if(e.target.id==='q'){q=e.target.value;window.__fq=1;render()}});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='k')act({target:document.querySelector('[data-a=login]')})});
/* pas de zoom au pincement (le double-tap est bloqué par touch-action) */
['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},{passive:false})});
document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
if(KEY)load(true);else render();
})();
</script></body></html>
