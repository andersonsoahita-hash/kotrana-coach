<style>
/* Concept : même identité que Kotrana (bleu nuit, cartes vitrées, accent bleu ciel, barre d'onglets flottante), sans le moteur du programme. */
:root{--bg:#08111F;--surface:#0F1C31;--surface2:#16284A;--line:#223B63;--fg:#EAF4FF;--muted:#8CA6C6;--accent:#5CC8FF;--accent2:#A8E4FF;--ink:#04243B;--good:#47DDA0;--warn:#FFB454;--bad:#FF7F8F;--glow:rgba(92,200,255,.22);--shadow:0 10px 30px rgba(0,0,0,.35);--fd:'Sora',system-ui,sans-serif;--fb:'DM Sans',system-ui,sans-serif;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#EEF6FE;--surface:#FFFFFF;--surface2:#E3F0FC;--line:#C9DDF1;--fg:#0A2038;--muted:#4F6D8D;--accent:#0B84D6;--accent2:#5FC1F3;--ink:#FFFFFF;--good:#0E9F69;--warn:#C27500;--bad:#D0384D;--glow:rgba(11,132,214,.16);--shadow:0 10px 26px rgba(30,80,130,.14);color-scheme:light}}
:root[data-theme="light"]{--bg:#EEF6FE;--surface:#FFFFFF;--surface2:#E3F0FC;--line:#C9DDF1;--fg:#0A2038;--muted:#4F6D8D;--accent:#0B84D6;--accent2:#5FC1F3;--ink:#FFFFFF;--good:#0E9F69;--warn:#C27500;--bad:#D0384D;--glow:rgba(11,132,214,.16);--shadow:0 10px 26px rgba(30,80,130,.14);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--fb);font-size:15px;line-height:1.45;min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent;background-image:radial-gradient(120% 60% at 85% -10%,var(--glow),transparent 60%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.app{max-width:520px;margin:0 auto;padding-block:14px 120px}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:700}h3{font-size:22px}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:24px 2px 10px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.card.hero{background:linear-gradient(155deg,var(--surface2),var(--surface) 70%);box-shadow:var(--shadow),0 0 0 1px var(--glow) inset;position:relative;overflow:hidden}
.card.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 70%);pointer-events:none}
.stack{display:flex;flex-direction:column;gap:12px}.list{display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:16px;font-weight:700;font-family:var(--fd);font-size:15px;width:100%}
.btn.pri{background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--ink);box-shadow:0 8px 22px var(--glow)}
.btn.sec{background:var(--surface2);border:1px solid var(--line)}
.btn.ghost{border:1px solid var(--line);min-height:40px;font-size:13.5px;padding:0 14px;font-weight:600}
.btn.bad{border:1px solid var(--bad);color:var(--bad);background:transparent}
.btn.sm{min-height:38px;padding:0 14px;font-size:13px;width:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500;white-space:nowrap;flex:none}
.chip.on{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface2);border:1px solid var(--line)}
.tag.p{background:var(--accent);color:var(--ink);border-color:var(--accent)}.tag.ok{color:var(--good)}.tag.no{color:var(--warn)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px}.brand b{font-family:var(--fd);font-size:20px;letter-spacing:.04em}.brand b i{font-style:normal;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-left:6px}
.brand small{display:block;color:var(--muted);font-size:12.5px;margin-top:-1px}
.logo{width:38px;height:38px;border-radius:12px;display:block}
.pill{font-size:12px;font-weight:700;padding:7px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mus{display:flex;flex-direction:column;gap:2px;text-align:left;min-height:92px;justify-content:flex-end}
.mus b{font-family:var(--fd);font-size:16px}.mus small{color:var(--muted);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.excard{display:block;text-align:left;width:100%}
.excard .t{font-family:var(--fd);font-weight:600;font-size:17px}
video,iframe.v{width:100%;border:0;border-radius:16px;background:#000;aspect-ratio:16/9;display:block;max-width:100%}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:700;padding:6px 0;margin-bottom:6px;font-size:14px}
.big{font-family:var(--fd);font-weight:700;font-size:20px}
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 46px;gap:8px;align-items:center;margin-bottom:8px}
.setrow.h{margin-bottom:4px;color:var(--muted);font-size:11.5px;text-align:center}
.setrow .n{font-family:var(--fd);color:var(--muted);font-weight:700;text-align:center}
.setrow input{text-align:center;font-family:var(--fd);font-weight:600;font-size:17px;min-height:50px;padding:0 6px}
.setrow .ok{height:50px;border-radius:14px;border:2px solid var(--line);display:grid;place-items:center;background:var(--surface)}
.setrow.done .ok{background:var(--good);border-color:var(--good);color:var(--ink)}
.field{display:flex;flex-direction:column;gap:5px;margin-top:12px}.field label{font-size:12px;color:var(--muted);font-weight:600}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:14px;min-height:46px;padding:0 12px;width:100%}
textarea{padding:10px 12px;min-height:90px}
.note{background:var(--surface2);border-radius:14px;padding:12px 14px;font-size:13.5px;margin:10px 0}
.note.warn{border:1px solid var(--warn)}.note.bad{border:1px solid var(--bad)}
.hist{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.sets{width:100%;border-collapse:collapse;font-size:14px}.sets th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:left;padding:3px 0}.sets td{padding:5px 0;border-top:1px solid var(--line)}
.sets td:first-child{color:var(--muted);width:26px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.tabs{max-width:520px;margin:0 auto;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:6px;box-shadow:var(--shadow)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:16px;color:var(--muted);font-size:11px;font-weight:600}
.tab.on{background:var(--surface2);color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:90%}
.gate{min-height:82vh;display:flex;flex-direction:column;justify-content:center;gap:18px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:13.5px}.chk input{width:22px;min-height:22px;height:22px;margin-top:1px;flex:none;accent-color:var(--accent)}
.cgu{max-height:210px;overflow:auto;font-size:13px;line-height:1.5;background:var(--surface2);border-radius:14px;padding:12px 14px;margin-top:10px}.cgu p{margin:0 0 8px}
.lnk{color:var(--accent);font-weight:600;text-decoration:underline;padding:6px 0;font-size:13.5px}
.sum{font-size:13px;color:var(--muted);margin-top:4px}
</style>

  <div class="stack" style="margin-top:12px"><button class="btn ghost" data-a="reload">Actualiser les exercices</button><button class="btn ghost" data-a="logout">${UI.sure?'Confirmer la déconnexion':'Me déconnecter'}</button></div><p class="tiny muted" style="margin-top:16px">Kotrana Coach by Stephen. Ton jeton reste lié à ce téléphone.</p>`}
function tabsHtml(){const t=isCoach()?[['ex','Exercices','ex'],['suivi','Suivi','suivi'],['acc','Moi','user']]:[['home','Accueil','home'],['ex','Exercices','ex'],['hist','Historique','hist'],['acc','Moi','user']];
  return `<div class="tabbar"><nav class="tabs">${t.map(x=>`<button class="tab ${UI.tab===x[0]&&!UI.ex?'on':''}" data-a="tab" data-t="${x[0]}">${ic(x[2])}<span>${x[1]}</span></button>`).join('')}</nav></div>`}
function render(){const app=$('#app');
  if(!ME){app.innerHTML=gateView();$('#tabs').innerHTML='';return}
  let h;
  if(UI.edit)h=formView();else if(UI.ex)h=exoView();
  else h=({home:homeView,ex:exView,hist:histView,suivi:suiviView,acc:accountView}[UI.tab]||(isCoach()?exView:homeView))();
  app.innerHTML=h;$('#tabs').innerHTML=UI.edit?'':tabsHtml()}
/* ---------- connexion ---------- */
function applyAuth(r){S.cache.me={n:r.nom,r:r.role,fin:r.fin,coach:r.coach,code:r.code||'',offre:r.offre||''};S.cache.videos=r.videos||[];S.cache.adherents=r.adherents||[];save();ME=S.cache.me;
  if(!UI.tab||(isCoach()&&UI.tab==='home')||(!isCoach()&&UI.tab==='suivi'))UI.tab=isCoach()?'suivi':'home'}
async function tryEnter(tok,silent){
  tok=String(tok||'').trim().toUpperCase();if(!tok)return;UI.busy=true;if(!ME)render();
  const r=await api({a:'auth',t:tok,dev:dev()});UI.busy=false;
  if(r.ok){setTok(tok);GATE.msg='';applyAuth(r);UI.tab=isCoach()?'suivi':'home';render();autoSync();if(isCoach())loadSuivi(true);return}
  if(r.e==='reseau'&&getTok()===tok&&S.cache.me&&S.cache.me.fin>=today()){ME=S.cache.me;UI.tab=isCoach()?'suivi':'home';render();toast('Hors connexion');return}
  if(r.e!=='reseau'&&r.e!=='occupe'&&r.e!=='erreur'){setTok('');}
  ME=null;GATE.tok=tok;GATE.msg=errMsg(r);if(GATE.mode==='choose'||GATE.mode==='req'||GATE.mode==='sent')GATE.mode='m';render()}
async function reloadAuth(){const t=getTok();if(!t)return;const r=await api({a:'auth',t,dev:dev()});if(r.ok){applyAuth(r);render();return true}toast(errMsg(r));return false}
/* ---------- synchro du soir ---------- */
let syncing=false,lastTry=0;
async function doSync(manual){
  if(syncing||!ME||isCoach())return;const p=pending();if(!p.length){if(manual)toast('Tout est déjà envoyé');return}
  syncing=true;UI.busy=true;if(manual)render();
  const sessions=p.slice(0,200).map(l=>({id:l.id,date:l.date,exo:l.n,series:l.sets.map(s=>({kg:num(s.kg)||0,reps:parseInt(s.reps,10)||0}))}));
  const r=await api({a:'sync',t:getTok(),dev:dev(),sessions});syncing=false;UI.busy=false;lastTry=Date.now();
  if(r.ok){const ids=new Set(sessions.map(x=>x.id));S.logs.forEach(l=>{if(ids.has(l.id))l.synced=true});S.lastSync=new Date().toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});save();if(manual)toast('Séances envoyées')}
  else if(manual)toast(errMsg(r));
  render()}
function autoSync(){if(!ME||isCoach()||syncing)return;const p=pending();if(!p.length)return;
  if(Date.now()-lastTry<10*6e4)return;
  if(new Date().getHours()>=20||p.some(l=>l.date<today()))doSync(false)}
setInterval(autoSync,5*6e4);document.addEventListener('visibilitychange',()=>{if(!document.hidden)autoSync()});
async function loadSuivi(quiet){if(!isCoach())return;UI.busy=true;if(!quiet)render();
  const r=await api({a:'suivi',t:getTok(),dev:dev()});UI.busy=false;
  if(r.ok){S.cache.suivi=r.seances;S.cache.suiviTs=new Date().toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});await reloadAuth();save()}else if(!quiet)toast(errMsg(r));render()}
/* ---------- actions ---------- */
document.addEventListener('input',ev=>{
  if(ev.target.id==='q'){UI.q=ev.target.value;const l=$('#exl');if(l)l.innerHTML=exCards()}
  else if(ev.target.dataset&&ev.target.dataset.i==='reps'){const r=ev.target.closest('.setrow');if(r)r.classList.toggle('done',!!ev.target.value.trim())}});
function readReq(){const g=k=>{const e=$(k);return e?e.value:''};const c=$('#rg');GATE.req={code:g('#rc').trim().toUpperCase(),nom:g('#rn').trim(),contact:g('#rt').trim(),infos:g('#ri').trim(),cgu:!!(c&&c.checked)}}
function readForm(){const g=k=>{const e=$(k);return e?e.value:null};UI.edit.n=g('#fn');UI.edit.t=g('#ft');UI.edit.u=g('#fu')}
document.addEventListener('click',async ev=>{const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,d=b.dataset;
  if(a!=='logout'&&a!=='delex')UI.sure=false;
  switch(a){
  case 'gate':if(GATE.mode==='req')readReq();GATE.mode=d.m;GATE.msg='';render();break;
  case 'cgu':readReq();UI.showCgu=!UI.showCgu;render();break;
  case 'enter':GATE.tok=$('#tk').value;await tryEnter(GATE.tok);break;
  case 'sendreq':{readReq();const q=GATE.req;if(!q.code||!q.nom||!q.contact){GATE.msg='Remplis le code coach, ton nom et ton contact.';render();break}
    if(!q.cgu){GATE.msg=MSG.cgu;render();break}
    UI.busy=true;GATE.msg='';render();const r=await api({a:'demande',nom:q.nom,contact:q.contact,infos:q.infos,coachCode:q.code,cgu:true});UI.busy=false;
    if(r.ok){GATE.mode='sent';GATE.req={};try{localStorage.removeItem(CDK)}catch(e){}}else GATE.msg=errMsg(r);render();break}
  case 'tab':UI.tab=d.t;UI.edit=null;UI.ex=null;render();window.scrollTo(0,0);if(d.t==='suivi')loadSuivi(true);break;
  case 'muscle':UI.f=d.m;UI.tab='ex';render();window.scrollTo(0,0);break;
  case 'filter':UI.f=d.m;render();break;
  case 'exo':UI.ex=d.id;render();window.scrollTo(0,0);break;
  case 'backex':UI.ex=null;render();break;
  case 'addset':{const box=$('#setbox'),n=box.querySelectorAll('.setrow:not(.h)').length,lg=lastLog(UI.ex);const t=document.createElement('div');t.innerHTML=setRow(n,lg&&lg.sets[n]);box.insertBefore(t.firstElementChild,b.parentElement);break}
  case 'savelog':{const rows=[...document.querySelectorAll('#setbox .setrow:not(.h)')];const sets=rows.map(r=>({kg:r.querySelector('[data-i=kg]').value.trim(),reps:r.querySelector('[data-i=reps]').value.trim()})).filter(s=>s.kg||s.reps);
    if(!sets.length){toast('Note au moins une série');break}
    const e=exById(UI.ex);S.logs.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),date:today(),ex:UI.ex,n:e?e.n:'Exercice',sets,synced:false});save();toast('Séries enregistrées');render();autoSync();break}
  case 'newex':UI.edit={id:null,m:d.m?[d.m]:[]};render();window.scrollTo(0,0);break;
  case 'editex':{const e=exById(d.id);UI.edit={id:e.id,m:e.m.slice()};render();window.scrollTo(0,0);break}
  case 'cancelform':UI.edit=null;render();break;
  case 'mtoggle':{readForm();const m=UI.edit.m,i=m.indexOf(d.m);i<0?m.push(d.m):m.splice(i,1);render();break}
  case 'saveex':{readForm();const E=UI.edit,n=(E.n||'').trim(),m=E.m;if(!n){toast('Donne un nom');break}if(!m.length){toast('Choisis au moins un muscle');break}
    UI.busy=true;render();const r=await api({a:'videoSave',t:getTok(),dev:dev(),id:E.id||'',muscle:m.join(','),exo:n,url:(E.u||'').trim(),consigne:(E.t||'').trim()});UI.busy=false;
    if(r.ok){await reloadAuth();UI.edit=null;toast('Exercice enregistré')}else toast(errMsg(r));render();break}
  case 'delex':{if(!UI.sure){UI.sure=true;render();break}UI.sure=false;const id=UI.edit.id;UI.busy=true;const r=await api({a:'videoDel',t:getTok(),dev:dev(),id});UI.busy=false;
    if(r.ok){await reloadAuth();UI.edit=null;UI.ex=null;toast('Exercice supprimé')}else toast(errMsg(r));render();break}
  case 'seed':{UI.busy=true;const r=await api({a:'videosBulk',t:getTok(),dev:dev(),items:SEED.map(x=>({exo:x[0],muscle:x[1]}))});UI.busy=false;if(r.ok){await reloadAuth();toast(r.n+' exercices ajoutés')}else toast(errMsg(r));render();break}
  case 'refreshsuivi':await loadSuivi(false);break;
  case 'syncnow':await doSync(true);break;
  case 'reload':if(await reloadAuth())toast('Exercices à jour');break;
  case 'copy':try{await navigator.clipboard.writeText(d.v);toast('Lien copié')}catch(e){toast('Copie refusée : sélectionne le texte')}break;
  case 'logout':if(!UI.sure){UI.sure=true;render();break}UI.sure=false;setTok('');ME=null;GATE={mode:'choose',msg:'',tok:'',req:{}};render();break;
  }});
/* ---------- démarrage ---------- */
window.addEventListener('entree:enter',e=>{const r=e.detail&&e.detail.role;if(!ME&&(r==='c'||r==='m')){GATE.mode=r;GATE.msg='';render()}});
(async function init(){load();
  try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
  try{const q=new URLSearchParams(location.search),c=(q.get('c')||'').trim().toUpperCase();if(c){localStorage.setItem(CDK,c)}if(q.has('c')||q.has('u')){history.replaceState(null,'',location.pathname+location.hash)}}catch(e){}
  try{GATE.req={code:localStorage.getItem(CDK)||''}}catch(e){}
  let tok=null;const m=location.hash.match(/[#&]t=([^&]+)/);
  if(m){tok=decodeURIComponent(m[1]);history.replaceState(null,'',location.pathname+location.search)}
  if(!tok)tok=getTok();
  if(GATE.req.code&&!tok){GATE.mode='req'}
  if(tok){await tryEnter(tok)}else render()})();
</script></body></html>
